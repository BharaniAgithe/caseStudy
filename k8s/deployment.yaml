apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-internship-tracker
  labels:
    app: student-internship-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-internship-tracker
  template:
    metadata:
      labels:
        app: student-internship-tracker
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USERNAME/student-internship-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_PATH
              value: /data/internships.db
            - name: SECRET_KEY
              value: "replace-with-a-random-secret"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: student-internship-tracker-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-internship-tracker-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
